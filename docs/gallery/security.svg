<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#0071e3"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#1d1d1f"/>
    </marker>
  </defs>
  <g fill="#ffffff" stroke="#d2d2d7">
    <rect x="30"   y="60" width="250" height="170" rx="14"/>
    <rect x="370"  y="60" width="250" height="170" rx="14"/>
    <rect x="710"  y="60" width="250" height="170" rx="14"/>
    <rect x="1050" y="60" width="250" height="170" rx="14"/>
  </g>
  <g text-anchor="middle">
    <g fill="#1d1d1f" font-size="21" font-weight="700">
      <text x="155"  y="100">Agent</text>
      <text x="495"  y="100">Broker</text>
      <text x="835"  y="100">Your ntfy</text>
      <text x="1175" y="100">Phone</text>
    </g>
  </g>
  <g fill="#6e6e73" font-size="15" text-anchor="middle">
    <text x="155"  y="134">Holds a bearer token.</text>
    <text x="155"  y="156">Never the vault.</text>
    <text x="495"  y="134">Holds the Bitwarden</text>
    <text x="495"  y="156">session in memory.</text>
    <text x="835"  y="134">Item name and reason.</text>
    <text x="835"  y="156">Never the value.</text>
    <text x="1175" y="134">The approval password.</text>
    <text x="1175" y="156">Not the master</text>
    <text x="1175" y="178">password.</text>
  </g>
  <g stroke="#0071e3" stroke-width="1.5" fill="none" marker-end="url(#b)" font-size="14">
    <line x1="286" y1="130" x2="364" y2="130"/>
    <line x1="626" y1="130" x2="704" y2="130"/>
    <line x1="966" y1="130" x2="1044" y2="130"/>
  </g>
  <path d="M1175 230 C1175 400 495 400 495 230" fill="none" stroke="#0071e3" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="835" y="392" text-anchor="middle" fill="#0071e3" font-size="14">approve</text>
  <path d="M495 230 C495 330 155 330 155 230" fill="none" stroke="#86868b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#c)"/>
  <text x="325" y="296" text-anchor="middle" fill="#1d1d1f" font-size="14">value, once · then gone</text>
  <text x="665" y="470" text-anchor="middle" fill="#1d1d1f" font-size="19">A stolen agent token can ask. It cannot read.</text>
  <text x="665" y="500" text-anchor="middle" fill="#6e6e73" font-size="15">The broker sends the value only after the approval password.</text>
  <text x="665" y="524" text-anchor="middle" fill="#6e6e73" font-size="15">Anyone who owns the broker host owns the vault session.</text>
</svg>
